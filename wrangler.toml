name = "mailfree"
main = "src/server.js"  # 关键：入口文件在 src 文件夹里
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（保持你原有的配置）
[[d1_databases]]
binding = "TEMP_MAIL_DB"
database_name = "maill_free_db"
database_id = "c82663ac-62b6-4ba6-be81-cbe297f2a3dd"

# 静态资源
[assets]
directory = "public"
binding = "ASSETS"

# ========== R2 完全注释，禁用 ==========
#[[r2_buckets]]
#binding = "MAIL_EML"
#bucket_name = "mail-eml"

[vars]
# FORWARD_RULES = "[]"
